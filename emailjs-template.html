<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Enquiry - {{from_name}}</title>
  </head>
  <body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
      style="background-color: #f4f4f4"
    >
      <tr>
        <td style="padding: 40px 20px">
          <table
            role="presentation"
            cellspacing="0"
            cellpadding="0"
            border="0"
            width="600"
            style="
              margin: 0 auto;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            "
          >
            <!-- Header -->
            <tr>
              <td style="background-color: #1a1a1a; padding: 30px 40px; text-align: center">
                <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 600">
                  New Enquiry
                </h1>
                <p style="margin: 10px 0 0 0; color: #888888; font-size: 14px">
                  Portfolio Contact Form
                </p>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding: 40px">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                  <!-- From Name -->
                  <tr>
                    <td style="padding-bottom: 20px">
                      <p
                        style="
                          margin: 0 0 5px 0;
                          color: #666666;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                        "
                      >
                        From
                      </p>
                      <p style="margin: 0; color: #1a1a1a; font-size: 18px; font-weight: 600">
                        {{from_name}}
                      </p>
                    </td>
                  </tr>

                  <!-- Email -->
                  <tr>
                    <td style="padding-bottom: 20px">
                      <p
                        style="
                          margin: 0 0 5px 0;
                          color: #666666;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                        "
                      >
                        Email
                      </p>
                      <p style="margin: 0; color: #1a1a1a; font-size: 16px">
                        <a
                          href="mailto:{{from_email}}"
                          style="color: #1a1a1a; text-decoration: none"
                          >{{from_email}}</a
                        >
                      </p>
                    </td>
                  </tr>

                  <!-- Opportunity Type -->
                  <tr>
                    <td style="padding-bottom: 20px">
                      <p
                        style="
                          margin: 0 0 5px 0;
                          color: #666666;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                        "
                      >
                        Opportunity Type
                      </p>
                      <p style="margin: 0; color: #1a1a1a; font-size: 16px; font-weight: 500">
                        {{opportunity_type}}
                      </p>
                    </td>
                  </tr>

                  <!-- Message -->
                  <tr>
                    <td>
                      <p
                        style="
                          margin: 0 0 5px 0;
                          color: #666666;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                        "
                      >
                        Message
                      </p>
                      <p
                        style="
                          margin: 0;
                          color: #1a1a1a;
                          font-size: 15px;
                          line-height: 1.6;
                          white-space: pre-wrap;
                        "
                      >
                        {{message}}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding: 0 40px">
                <div style="height: 1px; background-color: #e0e0e0"></div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding: 30px 40px; background-color: #f9f9f9; text-align: center">
                <p style="margin: 0; color: #666666; font-size: 12px">
                  This message was sent from your portfolio contact form.
                </p>
                <p style="margin: 10px 0 0 0; color: #888888; font-size: 11px">
                  © 2026 Jervin Habagat Portfolio
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
